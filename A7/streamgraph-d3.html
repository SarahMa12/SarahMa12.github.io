<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="a7-styles.css">
        <title>Streamgraph</title>
        <script src="https://d3js.org/d3.v6.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
        <style>            
            .myArea { 
                transition: opacity 0.2s; 
            }

            .tooltip {
                position: absolute;
                padding: 8px 12px;
                background: rgba(255, 255, 255, 0.98);
                border: 1px solid #0c4a6e;
                border-radius: 6px;
                pointer-events: none;
                font-size: 13px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
                color: #1e293b;
                opacity: 0;
            }

            .tooltip-city { 
                font-weight: 800; 
                font-size: 16px; 
                margin-bottom: 4px; 
                border-bottom: 1px solid #ddd; 
            }

            .tooltip-temp { 
                font-size: 14px; 
                font-weight: bold; 
                color: #0c4a6e; 
            }
        </style>
    </head>

    <body>
        <a class="backbutton" href="..">Back</a>
        <h1 style="text-align: center; color: #0c4a6e; margin-bottom: 0;">Streamgraph in D3 (with Tooltip)</h1>
        
        <div id="legend-container" style="display: flex; justify-content: center; margin-top: 10px; margin-bottom: 10px;"></div>
        <div id="chart-container"></div>

        <script>
            const margin = {top: 70, right: 30, bottom: 50, left: 60},
                width = 860 - margin.left - margin.right,
                height = 450 - margin.top - margin.bottom;

            const svg = d3.select("#chart-container")
            .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
            .append("g")
                .attr("transform", `translate(${margin.left}, ${margin.top})`);

            // Load csv data
            // Streamgraph source: https://d3-graph-gallery.com/graph/streamgraph_template.html
            d3.csv("weather.csv").then(function(data) {
                const parseTime = d3.timeParse("%Y-%m-%d"); // Format for x-axis scale
                const formatTime = d3.timeFormat("%b %d, %Y"); // Format for tooltip

                // Parse data
                data.forEach(d => {
                    d.date = parseTime(d["Date.Full"]);
                    d.temp = +d["Data.Temperature.Avg Temp"];
                });

                // Choose 4 cities to show on the graph
                const targetCities = ["San Francisco", "Phoenix", "Chicago", "Miami"];

                // Filter the data for only 2016 and the four cities
                const filtered = data.filter(d => 
                    d.date &&
                    targetCities.includes(d["Station.City"]) && 
                    d.date.getFullYear() === 2016
                );

                // Group by date then map each group to a single object
                const dataByDate = d3.group(filtered, d => d.date.getTime());
                const processedData = Array.from(dataByDate, ([date, values]) => {
                    const entry = { date: new Date(date) };
                    values.forEach(v => entry[v["Station.City"]] = v.temp);
                    return entry;
                }).sort((a, b) => a.date - b.date); // Sort so the stream is smooth

                const keys = targetCities;

                // X scale
                const x = d3.scaleTime()
                    .domain(d3.extent(processedData, d => d.date))
                    .range([ 0, width ]);

                // Y scale
                const y = d3.scaleLinear()
                    .domain([-160, 160])
                    .range([ height, 0 ]);

                // Color scale
                const color = d3.scaleOrdinal()
                    .domain(keys)
                    .range(d3.schemeTableau10);

                // Silhouette offset centers the stream around the middle axis
                const stackedData = d3.stack()
                    .offset(d3.stackOffsetSilhouette)
                    .keys(keys)(processedData);

                // Create areas
                const area = d3.area()
                    .curve(d3.curveBasis)
                    .x(d => x(d.data.date))
                    .y0(d => y(d[0]))
                    .y1(d => y(d[1]));

                const tooltipDiv = d3.select("body")
                    .append("div")
                    .attr("class", "tooltip");

                // Draw the layers and implement tooltip
                svg.selectAll("mylayers")
                    .data(stackedData)
                    .join("path")
                        .attr("class", "myArea")
                        .style("fill", d => color(d.key))
                        .attr("d", area)
                        .attr("opacity", 0.8)
                        .on("mouseover", function(event, d) {
                            tooltipDiv.style("opacity", 1);
                            d3.selectAll(".myArea").style("opacity", .2);
                            d3.select(this)
                                .style("stroke", "white")
                                .style("stroke-width", "2px")
                                .style("opacity", 1);
                        })
                        .on("mousemove", function(event, d) {
                            // Finding the closest data point based on mouse X
                            const [mouseX] = d3.pointer(event);
                            const xDate = x.invert(mouseX);
                            const bisectDate = d3.bisector(p => p.date).left;
                            const i = bisectDate(processedData, xDate, 1);
                            const d0 = processedData[i - 1];
                            const d1 = processedData[i];
                            const closest = (xDate - d0.date > d1.date - xDate) ? d1 : d0;

                            const cityName = d.key;
                            const tempValue = closest[cityName];

                            tooltipDiv
                                .html(`
                                    <div class="tooltip-city" style="color:${color(cityName)}">${cityName}</div>
                                    <div>${d3.timeFormat("%B %d, %Y")(closest.date)}</div>
                                    <div class="tooltip-temp">${tempValue}°F</div>
                                `)
                                .style("left", (event.pageX + 15) + "px")
                                .style("top", (event.pageY - 28) + "px");
                        })
                        .on("mouseleave", function() {
                            tooltipDiv.style("opacity", 0);
                            d3.selectAll(".myArea")
                                .style("opacity", 0.8)
                                .style("stroke", "none");
                        });

                // X-axis
                svg.append("g")
                    .attr("class", "axis-x")
                    .attr("transform", `translate(0, ${height})`)
                    .call(d3.axisBottom(x)
                        .ticks(d3.timeMonth
                        .every(1))
                        .tickFormat(d3.timeFormat("%b"))
                    );

                // Y-axis
                svg.append("g")
                    .attr("class", "axis-y")
                    .call(d3.axisLeft(y).ticks(0));

                // Color legend
                const legendSvg = d3.select("#legend-container")
                    .append("svg")
                    .attr("width", 800)
                    .attr("height", 65);

                const legend = d3.legendColor()
                    .shape("rect")
                    .shapeWidth(20)
                    .shapePadding(120)
                    .orient('horizontal')
                    .scale(color)
                    .labelAlign("start");

                legendSvg.append("g")
                    .attr("transform", "translate(50, 10)")
                    .call(legend);

                // Chart title
                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", -margin.top / 2) 
                    .attr("text-anchor", "middle")
                    .style("font-size", "22px")
                    .style("font-weight", "bold")
                    .style("fill", "#233367")
                    .text("Average Temperature Fluctuations by City (2016)");
                                
            });
        </script>
    </body>
</html>
