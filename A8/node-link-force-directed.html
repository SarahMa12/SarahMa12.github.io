<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../chart-styles.css">
    <title>Node-Link Diagram with Edge Bundling</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f9f9f9;
        }
        
        #chart-container {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 25px;
            margin-top: 10px;
        }
        /* Controls Styling */
        .controls {
            margin-top: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }
        
        .node {
            fill: #414d70;
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
        }
        .link {
            fill: none;
            stroke: #999;
            stroke-opacity: 0.6;
        }
    </style>
</head>
<body>
    <a class="backbutton" href="..">Back</a>

    <h2>Node-link Diagram with Force-Directed Layout and Edge Bundling</h2>
    
    <div class="controls">
        <label for="tension"><strong>Edge Bundling Tension:</strong></label>
        <input type="range" id="tension" min="0" max="1" step="0.05" value="0.85">
        <span id="tension-value">0.85</span>
    </div>

    <div id="chart-container"></div>

    <script>
        const svgWidth = 900;
        const svgHeight = 500;
        const margin = { top: 70, right: 160, bottom: 70, left: 80 };
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        d3.csv("soc-firm-hi-tech.csv").then(function(data) {

            // Process links and nodes
            const links = data.map(d => ({
                source: d.source,
                target: d.target,
                value: +d.weight
            }));

            const nodeIds = new Set(data.flatMap(d => [d.source, d.target]));
            const nodes = Array.from(nodeIds).map(id => ({ id: id }));

            // Create the simulation
            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100)) 
                .force("charge", d3.forceManyBody().strength(-120))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .on("tick", ticked);

            // Set up the line generator with an initial bundle tension
            const bundleLine = d3.line()
                .curve(d3.curveBundle.beta(0.85)) 
                .x(d => d.x)
                .y(d => d.y);

            // Draw links as paths
            const link = svg.append("g")
                .selectAll("path") 
                .data(links)
                .join("path")      
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value));

            // Draw nodes
            const node = svg.append("g")
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("class", "node")
                .attr("r", 8);
                
            // Tooltip
            node.append("title")
                .text(d => "Node: " + d.id);

            node.call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

            function ticked() {
                const centerPoint = { x: width / 2, y: height / 2 };

                link.attr("d", d => {
                    const pathData = [d.source, centerPoint, d.target];
                    return bundleLine(pathData);
                });

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);
            }

            // Slider interaction
            d3.select("#tension").on("input", function() {
                // Get the value from the slider
                const newBeta = +this.value;
                
                // Update the text to match the slider value
                d3.select("#tension-value").text(newBeta.toFixed(2));
                
                // Update the curve generator with the new value
                bundleLine.curve(d3.curveBundle.beta(newBeta));
                
                // Redraw all the paths
                const centerPoint = { x: width / 2, y: height / 2 };
                link.attr("d", d => {
                    const pathData = [d.source, centerPoint, d.target];
                    return bundleLine(pathData);
                });
            });

            // Drag functions
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
        });
    </script>
</body>
</html>
