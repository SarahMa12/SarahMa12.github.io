<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="a6-styles.css">
        <title>Bar Chart</title>
        <script src="https://d3js.org/d3.v6.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
        <style>
            .axis-x path,
            .axis-y path {
                stroke: #233367;
            }

            .axis-x .tick line,
            .axis-y .tick line {
                stroke: #233367;
            }

            .axis-title {
                font-size: 16px;
                fill: #233367;
                font-weight: 700;
                text-anchor: middle;
            }   

            .tick text {
                font-size: 16px; 
                fill: #233367;
            }

            .legendTitle {
                fill: #233367; 
                font-size: 16px;
                font-weight: 700;
                font-family: sans-serif;
            }

            .legendSequential .label {
                font-size: 14px;
                fill: #36477e;
            }

            .legendSequential g.legendCells {
                transform: translateY(10px);
                fill: #333;
            }
        </style>
    </head>

    <body>
        <a class="backbutton" href="..">Back</a>
        <h1>Bar Chart with Diverging Color Scale from Colorbrewer</h1>
        <div id="chart-container"></div>
        <script>
            const svgWidth = 900;
            const svgHeight = 600;
            const margin = { top: 60, right: 165, bottom: 120, left: 90 };
            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`)

            // Load csv data
            d3.csv("athlete_events.csv").then(data => {
                // Count number of athletes in each sport
                // Select top 10 sports with most athletes
                const sportCounts = d3.rollups(data, v => v.length, d => d.Sport)
                    .sort((a, b) => d3.descending(a[1], b[1]))
                    .slice(0, 10)
                    .map(d => d[0]);

                // Aggregate data to get average height and age
                const rolledData = d3.rollups(
                    data.filter(d => sportCounts.includes(d.Sport)),
                    v => ({
                        avgHeight: d3.mean(v, d => +d.Height),
                        avgAge: d3.mean(v, d => +d.Age)
                    }),
                    d => d.Sport
                ).map(([sport, values]) => ({ // Convert into objects
                    sport, 
                    avgHeight: values.avgHeight,
                    avgAge: values.avgAge
                })).sort((a, b) => d3.ascending(a.avgAge, b.avgAge)); // Sort by age so diverging colors are in order

                // Create scales
                // X-scale
                const x = d3.scaleBand()
                    .range([0, width])
                    .domain(rolledData.map(d => d.sport))
                    .padding(0.2);

                // Y-scale
                const y = d3.scaleLinear()
                    .domain([140, d3.max(rolledData, d => d.avgHeight) + 10]) // Adjusted to show height variation
                    .range([height, 0]);

                // Color scale
                const colorScale = d3.scaleDiverging()
                    .domain([18, 25, 32]) 
                    .interpolator(d3.interpolateRdBu); // Color from ColorBrewer link: https://colorbrewer2.org/#type=diverging&scheme=RdBu&n=5

                // Draw bars
                svg.selectAll("rect")
                    .data(rolledData)
                    .join("rect")
                    .attr("x", d => x(d.sport))
                    .attr("y", d => y(d.avgHeight))
                    .attr("width", x.bandwidth())
                    .attr("height", d => height - y(d.avgHeight))
                    .attr("fill", d => colorScale(d.avgAge))
                    .attr("stroke", "#233367")
                    .attr("stroke-width", 1);

                // Axes
                // Add X and Y axes
                svg.append("g")
                    .attr("class", "axis axis-x")
                    .attr("transform", `translate(0, ${height})`)
                    .call(d3.axisBottom(x))
                    .selectAll("text")
                    .attr("transform", "rotate(-40)")
                    .style("text-anchor", "end");

                svg.append("g")
                    .attr("class", "axis axis-y")
                    .call(d3.axisLeft(y).ticks(6));

                // X-axis title
                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", height + 90)
                    .attr("class", "axis-title")
                    .text("Sport");

                // Y-axis title
                svg.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -height / 2)
                    .attr("y", -50)
                    .attr("class", "axis-title")
                    .text("Average Athlete Height (cm)");

                // Chart title
                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", -20)
                    .attr("class", "graph-title")
                    .text("Average Height and Age Across Top Olympic Sports");

                // Color legend
                svg.append("g")
                    .attr("class", "legendDiverging")
                    .attr("transform", `translate(${width + 40}, 20)`);

                const legend = d3.legendColor()
                    .shapeWidth(30)
                    .cells(5)
                    .title("Average Age")
                    .scale(colorScale);

                svg.select(".legendDiverging")
                    .call(legend);
            });
        </script>
    </body>
</html>
