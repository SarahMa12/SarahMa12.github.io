<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>USA County Unemployment Choropleth</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    <link rel="stylesheet" href="../chart-styles.css">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(251, 243, 231);
        }
        svg {
            background-color: rgb(230, 217, 235);
            border-radius: 15px;
            margin: 10px 20px;
        }
        h1 { color: rgb(84, 24, 108); }
        .county { stroke: #fff; stroke-width: 0.2px; }
        .county:hover { fill: orange !important; stroke: #333; stroke-width: 1px; }
        .state-border { fill: none; stroke: #fff; stroke-width: 1px; pointer-events: none; }
        
        #tooltip {
            position: absolute;
            opacity: 0;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            pointer-events: none;
            font-size: 14px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .legendTitle {
            fill: rgb(84, 24, 108);
            font-weight: bold;
            font-size: 14px;
        }
        .label {
            fill: rgb(84, 24, 108);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <a class="backbutton" href="..">Back</a>
    <h1>Choropleth Map in D3 (with Tooltip)</h1>
    <div id="tooltip"></div>
    <div id="chart-container"></div>

    <script>
        const svgWidth = 900;
        const svgHeight = 700; 
        const margin = { top: 30, right: 40, bottom: 100, left: 40 };
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const tooltip = d3.select("#tooltip");

        // Projection scale
        // Source: https://d3js.org/d3-geo/conic 
        const projection = d3.geoAlbersUsa() // This format puts AK and HI in the corner on the bottom left 
            .scale(1150) 
            .translate([width / 2, height / 2]);

        // Generate paths per county
        const path = d3.geoPath().projection(projection);

        // Source:  // Source: https://observablehq.com/@d3/choropleth 
        let dataMap = new Map();
        
        // Color scale
        const colorScale = d3.scaleThreshold()
            .domain([2, 4, 6, 8, 10]) 
            .range(d3.schemePurples[6]);

        // Loading data
        // Source: https://d3-graph-gallery.com/graph/choropleth_basic.html 
        Promise.all([
            d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json"),
            d3.csv("Unemployment2023.csv") 
        ]).then(function(loadData) {
            let us = loadData[0];
            let csvData = loadData[1];

            // Map title 
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", -margin.top + 30)
                .attr("text-anchor", "middle")
                .style("font-size", "20px")
                .style("font-weight", "bold")
                .style("fill", "rgb(84, 24, 108)")
                .text("2020 U.S. County Unemployment Rates");

            // Aggregating data
            csvData.forEach(d => {
                if (d.Attribute === "Unemployment_rate_2020") {
                    const fips = d.FIPS_Code.padStart(5, '0');
                    dataMap.set(fips, { rate: +d.Value, name: d.Area_Name });
                }
            });

            // Draw counties
            svg.append("g")
                .selectAll("path")
                .data(topojson.feature(us, us.objects.counties).features)
                .join("path")
                .attr("class", "county")
                .attr("d", path)
                .attr("fill", d => {
                    let countyData = dataMap.get(d.id);
                    return countyData ? colorScale(countyData.rate) : "#666";
                })
                .on("mouseover", (event, d) => {
                    let countyData = dataMap.get(d.id);
                    tooltip.style("opacity", 1);
                    tooltip.html(countyData ? `<strong>${countyData.name}</strong><br>Rate: ${countyData.rate}%` : "No Data");
                })
                .on("mousemove", (event) => {
                    tooltip.style("left", (event.pageX + 15) + "px")
                           .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseleave", () => tooltip.style("opacity", 0));

            // State borders
            svg.append("path")
                .datum(topojson.mesh(us, us.objects.states, (a, b) => a !== b))
                .attr("class", "state-border")
                .attr("d", path);
            
            // Color legend
            const legendColor = d3.legendColor()
                .shapeWidth(40)
                .cells(6)
                .orient('horizontal')
                .scale(colorScale)
                .title("Unemployment Rate")
                .labelFormat(d3.format(".0f"))
                .labels(({ i, genLength, generatedLabels, domain }) => {
                  if (i === 0) return `< ${domain[0]}%`;
                  if (i === genLength - 1) return `> ${domain[domain.length - 1]}%`;
                  return generatedLabels[i];
                });

            svg.append("g")
                .attr("transform", `translate(${width - 300}, ${height + 20})`)
                .call(legendColor);
        });
    </script>
</body>
</html>
