<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>World Happiness Map 2015</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f8f9fa; margin: 0; padding: 20px; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; margin-bottom: 20px; }
        svg { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .country { stroke: #fff; stroke-width: 0.3px; transition: fill 0.2s; }
        .country:hover { fill: #2c3e50 !important; cursor: pointer; stroke: #000; stroke-width: 1px; }
        #tooltip {
            position: absolute; opacity: 0; background: white; padding: 12px;
            border-radius: 8px; pointer-events: none; font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 100; border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h1>World Happiness Report (2015)</h1>
    <p>Hover over countries to see their Happiness Score</p>
    <div id="tooltip"></div>
    <div id="chart-container"></div>

    <script>
        const width = 1000, height = 600;
        const svg = d3.select("#chart-container").append("svg").attr("viewBox", `0 0 ${width} ${height}`);
        const projection = d3.geoNaturalEarth1().scale(170).translate([width / 2, height / 2.2]);
        const path = d3.geoPath().projection(projection);
        
        const colorScale = d3.scaleSequential(d3.interpolateViridis).domain([3, 8]);

        Promise.all([
            d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
            d3.csv("2015.csv")
        ]).then(function([world, csvData]) {
            
            const dataMap = new Map();

            csvData.forEach(d => {
                const name = d["Country"].trim();
                const score = parseFloat(d["Happiness Score"]);
                
                if (!isNaN(score)) {
                    dataMap.set(finalName, {
                        score: score,
                        rank: d["Happiness Rank"],
                        economy: d["Economy (GDP per Capita)"]
                    });
                }
            });

            const countries = topojson.feature(world, world.objects.countries).features;

            svg.append("g")
                .selectAll("path")
                .data(countries)
                .join("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", d => {
                    const entry = dataMap.get(d.properties.name);
                    return entry ? colorScale(entry.score) : "#f0f0f0"; 
                })
                .on("mouseover", (event, d) => {
                    const entry = dataMap.get(d.properties.name);
                    d3.select("#tooltip").style("opacity", 1)
                        .html(`<strong>${d.properties.name}</strong><br/>
                               Score: <b>${entry ? entry.score : 'No Data'}</b><br/>
                               Rank: ${entry ? entry.rank : 'N/A'}`);
                })
                .on("mousemove", (event) => {
                    d3.select("#tooltip")
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseleave", () => d3.select("#tooltip").style("opacity", 0));

            // Legend
            const legend = d3.legendColor()
                .shapeWidth(40).orient('horizontal').scale(colorScale)
                .title("Happiness Score (0-10)").cells(6).labelFormat(d3.format(".1f"));

            svg.append("g").attr("transform", "translate(50, 520)").call(legend);
        });
    </script>
</body>
</html>
