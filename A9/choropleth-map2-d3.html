<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>World Happiness Map (2015)</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    <link rel="stylesheet" href="../chart-styles.css">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(251, 243, 231);
        }
        svg {
            background-color: rgb(230, 217, 235);
            border-radius: 15px;
            margin: 10px 20px;
            box-shadow: 0 10px 30px rgba(84, 24, 108, 0.1);
        }

        h1 { color: rgb(84, 24, 108); }
        
        #chart-container { width: 100%; max-width: 900px; }

        .country {
            stroke: #fff;
            stroke-width: 0.4px;
            transition: all 0.2s ease;
        }

        .country:hover {
            fill: #ffcc00 !important;
            stroke: #444;
            stroke-width: 1px;
            cursor: pointer;
        }

        #tooltip {
            position: absolute;
            opacity: 0;
            background: rgba(255, 255, 255, 0.98);
            padding: 12px 16px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid #eee;
        }

        .legendTitle {
            fill: rgb(84, 24, 108);
            font-weight: bold;
            font-size: 14px;
        }
        .label { fill: rgb(84, 24, 108); font-size: 12px; }
    </style>
</head>

<body>
    <a class="backbutton" href="..">Back</a>
    <h1>Choropleth Map (with Tooltip)</h1>
    <div id="tooltip"></div>
    <div id="chart-container"></div>

    <script>
        const svgWidth = 900;
        const svgHeight = 650; 
        const margin = { top: 70, right: 40, bottom: 100, left: -10 }; 
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Map title
        svg.append("text")
            .attr("x", width / 2)
            .attr("y", -25)
            .attr("text-anchor", "middle")
            .style("font-size", "18px")
            .style("font-weight", "700")
            .style("fill", "rgb(84, 24, 108)")
            .text("World Happiness Score (2015)");

        const tooltip = d3.select("#tooltip");

        // Projection scale
        const projection = d3.geoNaturalEarth1()
            .scale(160)
            .translate([width / 2, height / 2]);

        // Generate paths for each country
        const path = d3.geoPath().projection(projection);

        // Color scale
        const colorScale = d3.scaleSequential(d3.interpolatePuRd)
            .domain([2.5, 8]);

        // Loading data
        Promise.all([
            d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
            d3.csv("2015.csv")
        ]).then(function([world, csvData]) {

            const dataStore = new Map();

            csvData.forEach(d => {
                let name = d.Country.trim();
                
                dataStore.set(name, {
                    score: +d["Happiness Score"],
                    rank: +d["Happiness Rank"]
                });
            });

            // Draw countries
            svg.append("g")
                .selectAll("path")
                .data(topojson.feature(world, world.objects.countries).features)
                .join("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", d => {
                    const entry = dataStore.get(d.properties.name);
                    return entry ? colorScale(entry.score) : "#999";
                })
                // Tooltip interactions
                .on("mouseover", (event, d) => {
                    const entry = dataStore.get(d.properties.name);
                    tooltip.style("opacity", 1);
                    tooltip.html(entry ? 
                        `<strong style="color:#54186c">${d.properties.name}</strong><br>Score: <b>${entry.score.toFixed(2)}</b><br>Rank: <b>#${entry.rank}</b>` : 
                        `<strong>${d.properties.name}</strong><br>No Data Available`
                    );
                })
                .on("mousemove", (event) => {
                    tooltip.style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseleave", () => tooltip.style("opacity", 0));

            // Color legend
            const legend = d3.legendColor()
                .shapeWidth(40)
                .orient('horizontal')
                .scale(colorScale)
                .title("Happiness Score")
                .labelFormat(d3.format(".1f"))
                .cells(6);

            svg.append("g")
                .attr("transform", `translate(${width - 230}, ${height + 30})`)
                .call(legend);
        });
    </script>
</body>
</html>
