<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../chart-styles.css">
        <title>Box Plot</title>
        <script src="https://d3js.org/d3.v6.min.js"></script>
        <style>
            .dot {
                fill: #8c636b;
            }

            .axis-x path,
            .axis-y path {
                fill: none;
                stroke: black;
                shape-rendering: crispEdges;
            }

            .axis-x .tick line,
            .axis-y .tick line {
                stroke: black;
            }

            .axis text {
                font-size: 12px;
            }

            .axis-title {
                font-size: 16px;
                fill: #5a3e44;
                font-weight: 700;
                text-anchor: middle;
            }   
            
            .graph-title {
                font-size: 18px;
                fill: #492f36;
                font-weight: 700;
                text-anchor: middle;
            }    
        </style>
    </head>

    <body>
        <a class="backbutton" href="..">Back</a>
        <h1>Olympic Athlete Height vs Weight (with Tooltip) in d3</h1>

        <div id="chart-container"></div>
        <div class="tooltip" id="tooltip"></div>

            // Set up svg size and margins
            const svgWidth = 800;
            const svgHeight = 500;
            const margin = { top: 40, right: 40, bottom: 50, left: 80 };
            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            // Load csv data
            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`)
