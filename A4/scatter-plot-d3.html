<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../chart-styles.css">
        <title>Scatter Plot</title>
        <script src="https://d3js.org/d3.v6.min.js"></script>
        <style>
            .dot {
                fill: #8c636b;
            }

            .axis-x path,
            .axis-y path {
                fill: none;
                stroke: black;
                shape-rendering: crispEdges;
            }

            .axis-x .tick line,
            .axis-y .tick line {
                stroke: black;
            }

            .axis text {
                font-size: 12px;
            }

            .axis-title {
                font-size: 16px;
                fill: #5a3e44;
                font-weight: 700;
                text-anchor: middle;
            }   
            
            .graph-title {
                font-size: 18px;
                fill: #492f36;
                font-weight: 700;
                text-anchor: middle;
            }    

            .tooltip {
                position: absolute;
                background: rgba(73, 47, 54, 0.75);
                color: #efeeee;
                padding: 6px 10px;
                border-radius: 4px;
                font-size: 13px;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.15s ease;
            }
        </style>
    </head>

    <body>
        <a class="backbutton" href="..">Back</a>
        <h1>Olympic Athlete Height vs Weight (with Tooltip) in d3</h1>

        <div id="chart-container"></div>
        <div class="tooltip" id="tooltip"></div>

        <script>
            // Source: bar-chart-csv.html from prof examples
            // Set up svg size and margins
            const svgWidth = 800;
            const svgHeight = 500;
            const margin = { top: 40, right: 40, bottom: 50, left: 80 };
            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            // Load csv data
            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`)

            d3.csv("athlete_events.csv").then(function(data) {
                data.forEach(d => {
                    d.Height = +(d.Height / 30.48);
                    d.Weight = +(d.Weight * 2.205);
                });

                const filteredData = data.filter(d => d.Height && d.Weight);
                
                // Set X scale
                const x = d3.scaleLinear()
                    .domain([d3.min(filteredData, d => d.Height) - 5, d3.max(filteredData, d => d.Height) + 5])
                    .range([0, width]);

                // Set Y scale 
                const y = d3.scaleLinear()
                    .domain([d3.min(filteredData, d => d.Weight) - 5, d3.max(filteredData, d => d.Weight) + 5])
                    .nice()
                    .range([height, 0]);

                // Create X-axis
                svg.append("g")
                    .attr("class", "axis axis-x")
                    .attr("transform", `translate(0, ${height})`)
                    .call(d3.axisBottom(x));

                // Create Y-axis
                svg.append("g")
                    .attr("class", "axis axis-y")
                    .call(d3.axisLeft(y).ticks(10));

                const tooltip = d3.select("#tooltip");

                // Draw dots & implement tooltip
                // Source: https://d3-graph-gallery.com/graph/scatter_basic.html
                svg.selectAll(".dot")
                    .data(filteredData)
                    .enter()
                    .append("circle")
                    .attr("class", "dot")
                    .attr("cx", d => x(d.Height))
                    .attr("cy", d => y(d.Weight))
                    .attr("r", 3) // Set radius of the dot
                    // Event tool tip source: professor's code
                    .on("mouseover", (event, d) => {
                    tooltip
                        .html(`<strong>Name</strong>: ${d.Name} <br><strong>Sport</strong>: ${d.Sport}`)
                        .style("opacity", 1);
                    })
                    .on("mousemove", (event) => {
                        tooltip
                            .style("left", (event.pageX + 12) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseleave", (event) => {
                        tooltip.style("opacity", 0);    
                    });

                // Add X-axis title
                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", height + 45)
                    .attr("class", "axis-title")
                    .text("Height (ft)");
                
                // Add Y-axis title
                svg.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -height / 2)
                    .attr("y", -65)
                    .attr("class", "axis-title")
                    .text("Weight (lbs)");

                // Add graph title
                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", -20)
                    .attr("class", "graph-title")
                    .text("Olympic Athlete Height vs Weight");
            });
        </script>
    </body>
</html>
