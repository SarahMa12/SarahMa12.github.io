<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../chart-styles.css">
        <title>Bar Chart</title>
        <script src="https://d3js.org/d3.v6.min.js"></script>
        <style>
            .bar {
                fill: #8c636b;
            }

            .axis-x path,
            .axis-y path {
                fill: none;
                stroke: black;
                shape-rendering: crispEdges;
            }

            .axis-x .tick line,
            .axis-y .tick line {
                stroke: black;
            }

            .axis text {
                font-size: 12px;
            }

            .axis-title {
                font-size: 16px;
                fill: #5a3e44;
                font-weight: 700;
                text-anchor: middle;
            }   
            
            .graph-title {
                font-size: 18px;
                fill: #492f36;
                font-weight: 700;
                text-anchor: middle;
            }  
        </style>
    </head>

    <body>
        <a class="backbutton" href="..">Back</a>
        <h1>Olympic Athlete Age Distribution in d3</h1>
        <div id="chart-container"></div>
        <script>
            // Source: bar-chart-csv.html from prof examples
            // Set up svg size and margins
            const svgWidth = 800;
            const svgHeight = 500;
            const margin = { top: 40, right: 40, bottom: 50, left: 80 };
            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            // Load csv data
            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`)

            d3.csv("athlete_events.csv").then(function(data) {
                // Convert string values to numbers
                data.forEach(function(d) {
                    d.Age = +d.Age;
                });

                // Create an array of just the ages
                const ages = data.map(d => d.Age);

                // Group age values into ranges of 20 bins
                // Source: https://d3js.org/d3-array/bin
                const bins = d3.bin()
                    .domain(d3.extent(ages))
                    .thresholds(20)(ages);

                // Set X scale (one bar per sport)
                const x = d3.scaleLinear()
                    .domain([0, 100])
                    .range([0, width]);

                // Set Y scale (0 to max count)
                const y = d3.scaleLinear()
                    .domain([0, d3.max(bins, d => d.length)])
                    .nice()
                    .range([height, 0])

                // Create X-axis
                svg.append("g")
                    .attr("class", "axis axis-x")
                    .attr("transform", `translate(0, ${height})`)
                    .call(d3.axisBottom(x));

                // Create Y-axis
                svg.append("g")
                    .attr("class", "axis axis-y")
                    .call(d3.axisLeft(y).ticks(8));

                // Draw bars
                svg.selectAll(".bar")
                    .data(bins)
                    .enter()
                    .append("rect")
                    .attr("class", "bar")
                    .attr("x", d => x(d.x0))
                    .attr("width", d => x(d.x1) - x(d.x0) - 1) // -1 for spacing
                    .attr("y", d => y(d.length))
                    .attr("height", d => height - y(d.length));

                // Add X-axis title
                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", height + 45)
                    .attr("class", "axis-title")
                    .text("Age");

                // Add X-axis title
                svg.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -height / 2)
                    .attr("y", -65)
                    .attr("class", "axis-title")
                    .text("Count");

                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", -20)
                    .attr("class", "graph-title")
                    .text("Olympic Athlete Age Distribution");
            });
        </script>
    </body>
</html>
