<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ethical Study Hours Bar Chart</title>
        <script src="https://d3js.org/d3.v6.min.js"></script>
        <style>
            /* Using a single professional color for clarity */
            .bar {
                fill: #4e79a7;
            }
           
            .axis text {
                font-size: 12px;
            }
            .axis-title {
                font-size: 14px;
                fill: #333;
                font-weight: 600;
                text-anchor: middle;
            }   
            .graph-title {
                font-size: 18px;
                fill: #222;
                font-weight: 700;
                text-anchor: middle;
            }  
            .grid line {
                stroke: #e0e0e0;
                stroke-opacity: 0.7;
                shape-rendering: crispEdges;
            }
            .grid path {
                stroke-width: 0;
            }
        </style>
    </head>

    <body>
        <a class="backbutton" href="..">Back</a>
        <h1>Ethical Bar Chart</h1>
        <link rel="stylesheet" href="../chart-styles.css">
        <div id="chart-container"></div>

        <script>
            const svgWidth = 800; 
            const svgHeight = 500;
            const margin = { top: 60, right: 40, bottom: 70, left: 80 };
            const width = svgWidth - margin.left - margin.right;
            const height = svgHeight - margin.top - margin.bottom;

            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", svgWidth)
                .attr("height", svgHeight)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            d3.csv("study_grades.csv").then(function(data) {
                data.forEach(d => {
                    d.hours_studied = +d.hours_studied;
                    d.test_score = +d.test_score;
                });

                data.sort((a, b) => a.hours_studied - b.hours_studied);

                const x = d3.scaleBand()
                    .domain(data.map(d => d.hours_studied))
                    .range([0, width])
                    .padding(0.2);

                const y = d3.scaleLinear()
                    .domain([0, 100]) 
                    .nice()
                    .range([height, 0]);

                svg.append("g")			
                    .attr("class", "grid")
                    .call(d3.axisLeft(y)
                        .ticks(10)
                        .tickSize(-width)
                        .tickFormat("")
                    );

                // X-axis
                svg.append("g")
                    .attr("transform", `translate(0, ${height})`)
                    .call(d3.axisBottom(x));

                // Y-axis
                svg.append("g")
                    .call(d3.axisLeft(y).ticks(10).tickFormat(d => d + "%"));

                svg.selectAll(".bar")
                    .data(data)
                    .enter()
                    .append("rect")
                    .attr("class", "bar")
                    .attr("x", d => x(d.hours_studied))
                    .attr("width", x.bandwidth())
                    .attr("y", d => y(d.test_score))
                    .attr("height", d => height - y(d.test_score));

                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", height + 45)
                    .attr("class", "axis-title")
                    .text("Hours Studied");
                
                svg.append("text")
                    .attr("transform", "rotate(-90)")
                    .attr("x", -height / 2)
                    .attr("y", -55)
                    .attr("class", "axis-title")
                    .text("Test Score");

                svg.append("text")
                    .attr("x", width / 2)
                    .attr("y", -25)
                    .attr("class", "graph-title")
                    .text("Test Scores by Hours Studied (Ethical Version)");
            });
        </script>
    </body>
</html>
